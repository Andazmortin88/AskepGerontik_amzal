name: Release QA
on:
  push:
    branches: [review/role-dashboards-weekly-20261113, main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
      - run: npm install --prefix qa --ignore-scripts --no-audit --no-fund
      - run: qa/node_modules/.bin/playwright install --with-deps chromium
      - run: sudo apt-get install -y poppler-utils
      - run: node qa/release-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-release-qa
          path: qa/out
          retention-days: 7