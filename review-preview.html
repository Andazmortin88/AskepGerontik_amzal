catalog:()=>pageTitle('Referensi diagnosis','149 SDKI–SLKI–SIKI.','Snapshot sumber 8 November 2026. Seluruh entri merupakan referensi pembelajaran yang perlu ditelaah terhadap edisi resmi prodi sebelum penerapan klinik.')+`<div class="two"><div class="card"><input id="dxSearch" class="search" placeholder="Cari kode atau diagnosis" aria-label="Cari diagnosis"><select id="dxFilter" aria-label="Filter diagnosis"><option value="all">Seluruh 149 diagnosis</option><option value="gerontik">Pilihan relevan gerontik</option></select><p id="dxCount" class="tiny"></p><div id="dxList" class="catalog"></div></div><div id="dxDetail" class="card"></div></div>`,
logbook:()=>pageTitle('Pengalaman → refleksi → kompetensi','Logbook gerontik.','Pilih target, catat tindakan dan hasil, lalu ajukan kepada pembimbing. Gunakan data simulasi tanpa identitas pasien.')+`<div class="two"><div class="card"><h2>Katalog kompetensi</h2><input id="skillSearch" class="search" placeholder="Cari keterampilan atau instrumen" aria-label="Cari kompetensi"><p class="tiny">${DATA.competencies.length} target draf · 17 instrumen terpisah · frekuensi sesuai RPS/indikasi</p><div class="catalog" id="skillList"></div></div><div class="card"><h2>Catat pengalaman</h2><form id="logForm"><div class="banner" id="chosenSkill"></div><div class="fields"><div><label for="logDate">Tanggal</label><input id="logDate" name="date" type="date" required max="${today()}" value="${today()}"></div><div><label for="logShift">Shift</label><select id="logShift" name="shift"><option>Pagi</option><option>Siang</option></select></div><div><label for="logRoom">Wisma</label><select id="logRoom" name="room">${['A','B','C','D'].map(x=>`<option>Wisma ${x}</option>`).join('')}</select></div><div><label for="context">Konteks</label><select id="context" name="context"><option>Simulasi</option><option>Praktik klinik</option></select></div></div><label for="roleAction">Peran mahasiswa</label><select id="roleAction" name="action"><option>Mengamati</option><option>Melakukan simulasi</option><option>Melakukan dengan supervisi</option></select><label for="supervisor">Pembimbing yang mengamati</label><input id="supervisor" name="supervisor" placeholder="Nama pembimbing demo" required maxlength="100"><label for="summary">Ringkasan tindakan dan hasil</label><textarea id="summary" name="summary" required maxlength="3000" placeholder="Peran, respons lansia/manekin, temuan dan tindak lanjut. Tanpa identitas pasien."></textarea><label for="reflection">Refleksi dan rencana perbaikan</label><textarea id="reflection" name="reflection" required maxlength="3000" placeholder="Pemahaman awal, hal yang dipelajari, risiko, dan langkah perbaikan."></textarea><div class="actions"><button type="submit" name="intent" value="draft" class="btn light">Simpan draf</button><button type="submit" name="intent" value="submit" class="btn">Ajukan review</button></div></form></div></div><div class="section card"><h2>Riwayat logbook</h2>${records('logs')}</div>`,
reflection:()=>pageTitle('Belajar dari pengalaman','Refleksi mingguan.','Dua refleksi per stase. Uraikan perubahan pemahaman dan tindakan berikutnya, bukan sekadar daftar kegiatan.')+`<div class="two"><form class="card" id="reflectionForm"><h2>Catat refleksi</h2><label for="week">Minggu</label><select id="week" name="week"><option value="1">Minggu 1</option><option value="2">Minggu 2</option></select><label for="refText">Pengalaman, asumsi awal, bukti, dan perubahan</label><textarea name="text" id="refText" required maxlength="5000" placeholder="Apa yang terjadi? Asumsi apa tentang lansia yang perlu ditinjau? Bukti/umpan balik apa yang mengubah pemahaman Anda?"></textarea><label for="refPlan">Rencana tindak lanjut</label><textarea name="plan" id="refPlan" required maxlength="3000"></textarea><button class="btn" type="submit">Ajukan refleksi</button></form><div class="card"><h2>Riwayat refleksi</h2>${records('reflections')}</div></div>`,
attendance:()=>pageTitle('Kedisiplinan & akuntabilitas','Daftar hadir praktik.','Laporan mandiri tanpa GPS. Kehadiran dinyatakan terverifikasi setelah diperiksa pembimbing; satu laporan per tanggal dan shift.')+`<div class="two"><form class="card" id="attendanceForm"><h2>Catat dinas</h2><label for="attDate">Tanggal · Senin–Jumat</label><input id="attDate" name="date" type="date" max="${today()}" value="${today()}" required><div class="fields"><div><label for="attShift">Shift</label><select id="attShift" name="shift"><option>Pagi</option><option>Siang</option></select></div><div><label for="attRoom">Wisma</label><select id="attRoom" name="room">${['A','B','C','D'].map(x=>`<option>Wisma ${x}</option>`).join('')}</select></div><div><label for="attStart">Jam masuk</label><input id="attStart" name="start" type="time"></div><div><label for="attEnd">Jam keluar</label><input id="attEnd" name="end" type="time"></div></div><label for="presence">Status kehadiran</label><select id="presence" name="presence"><option>Hadir</option><option>Izin</option><option>Sakit</option></select><label for="attNote">Catatan / alasan</label><textarea id="attNote" name="note" maxlength="2000" placeholder="Pre-conference, kegiatan atau alasan izin/sakit."></textarea><button type="submit" class="btn">Ajukan kehadiran</button></form><div class="card"><h2>Riwayat laporan dinas</h2>${records('attendance')}</div></div>`,
skin:()=>pageTitle('Dokumentasi terstruktur','Integritas kulit & luka.','Contoh format pengkajian untuk ditelaah dosen. Bukan instrumen penilaian luka tervalidasi; diagnosis tidak ditentukan otomatis.')+`<form id="skinForm" class="card"><div class="fields"><div><label for="skinDate">Tanggal</label><input name="date" id="skinDate" type="date" max="${today()}" value="${today()}" required></div><div><label for="caseCode">Kode kasus simulasi</label><input id="caseCode" name="caseCode" required maxlength="40" placeholder="SIM-001"></div></div><label for="skinStatus">Kondisi kulit umum dan lokasi</label><textarea id="skinStatus" name="skinStatus" required maxlength="2000" placeholder="Keutuhan, warna, kelembapan, keluhan dan lokasi; tulis temuan aktual."></textarea><label for="wound">Temuan luka jika ada</label><textarea id="wound" name="wound" maxlength="2000" placeholder="Lokasi, panjang × lebar × kedalaman (cm), dasar luka, eksudat, tepi, kulit sekitar, nyeri. Bila tidak ada luka, tulis tidak ada."></textarea><label for="skinPlan">Respons, eskalasi dan tindak lanjut pembimbing</label><textarea id="skinPlan" name="plan" required maxlength="2000"></textarea><div class="actions"><button class="btn">Simpan contoh pengkajian</button><button type="button" class="btn light" data-go="catalog">Telaah diagnosis terkait</button></div></form><div class="card section"><h2>Dokumentasi demo</h2>${records('skin')}</div>`,
review:()=>pageTitle('Umpan balik yang dapat ditindaklanjuti','Review pembimbing.','Umpan balik dari dosen sesuai penugasan pada portofolio ini.')+(teacher()?`<div class="banner">Akses dosen terverifikasi. Keputusan dicatat di server.</div>`:`<div class="banner">Hasil review akan muncul setelah dosen meninjau pengajuan Anda.</div>`)+['logs','reflections','attendance'].map((k,i)=>`<div class="card section"><h2>${['Logbook kompetensi','Refleksi mingguan','Kehadiran'][i]}</h2>${records(k,true)}</div>`).join(''),
matrix:()=>pageTitle('Rancangan akademik','Target & penilaian.','Selaras dengan draf RPS PPKG UBS 2026/2027 yang masih menunggu pengesahan CPL dan prodi.')+`<div class="grid"><div class="card"><span class="num">10 + 2</span><h3>Logbook & refleksi</h3><p>10 catatan harian dan dua refleksi mingguan. Pengalaman tindakan dicatat sebagai bukti di dalam periode tersebut.</p></div><div class="card"><span class="num">2</span><h3>Asuhan individu</h3><p>Satu kasus per minggu; subjek berbeda jika tersedia dan sesuai prioritas klinik.</p></div><div class="card"><span class="num">70 + 20</span><h3>Jam pembelajaran</h3><p>70 jam langsung dan 20 jam terstruktur/mandiri. Rekap waktu aktual diverifikasi pembimbing.</p></div></div><div class="card section scroll"><h2>Bobot penilaian dari draf RPS</h2><table><thead><tr><th>Komponen</th><th>Bobot</th></tr></thead><tbody>${[['Klinik terobservasi: mini-CEX 15; DOPS 10; BST 5',30],['Dua asuhan digital',25],['Uji/presentasi kasus dan EBN',15],['TAK / edukasi kelompok',10],['Portofolio / logbook',10],['Profesionalisme dan keselamatan',10]].map(([t,n])=>`<tr><td>${t}</td><td>${n}%</td></tr>`).join('')}</tbody></table><p class="tiny">Belum ada kalkulasi nilai akhir atau keputusan lulus pada preview. Rubrik 0–4 memerlukan bukti observasi; batas lulus dan kebijakan remediasi ditetapkan prodi.</p></div><div class="card section scroll"><h2>Matriks target draf</h2><table><thead><tr><th>Kode lokal</th><th>Domain / kompetensi</th><th>Target</th></tr></thead><tbody>${DATA.competencies.map(c=>`<tr><td>${c.id}</td><td>${esc(c.group)}<br><strong>${esc(c.name)}</strong></td><td>${esc(c.target)}</td></tr>`).join('')}</tbody></table></div><div class="card section"><h2>Ekspor portofolio terpilih</h2><p>Ekspor memuat portofolio yang sedang dibuka. Simpan berkas pada perangkat yang aman.</p><div class="actions"><button id="exportJson" class="btn">Unduh portofolio JSON</button><button id="exportCsv" class="btn light">Unduh logbook CSV</button><button id="print" class="btn light">Cetak tampilan</button><button id="reset" class="btn light">Hapus data demo</button></div><details><summary>Evaluasi pengembangan untuk SATRIA</summary><p>Ukur kemampuan klinik terobservasi, penalaran kasus dan kualitas refleksi sebelum/sesudah pembelajaran. Statistik kunjungan hanya mendukung evaluasi proses. Desain penelitian, pembanding, sampel dan etik ditetapkan dalam protokol terpisah.</p></details></div>`
};
function records(key,review=false){const list=db[key].filter(x=>!review||['Diajukan','Perlu revisi','Terverifikasi'].includes(x.status));if(!list.length)return '<div class="blank">Belum ada catatan.</div>';return list.slice().reverse().map(x=>`<article class="record"><div>${badge(x.status||'Draf')} <span class="tiny">${esc(x.date||'Minggu '+x.week)} ${esc(x.shift||'')} · ${esc(x.room||'')}</span></div><h3>${esc(x.skill?(DATA.competencies.find(c=>c.id===x.skill)?.name||x.skillName||x.skill):x.skillName?x.skillName:x.week?'Refleksi minggu '+x.week:x.caseCode||x.presence)}</h3>${x.start?`<p class="tiny">Jam: ${esc(x.start)}–${esc(x.end)}${x.late?' · Dilaporkan setelah tanggal kegiatan':''}</p>`:''}${x.corrections?.map(c=>`<div class="banner">Koreksi mahasiswa: ${esc(c.text)}</div>`).join('')||''}${x.context?`<span class="tag gray">${esc(x.context)} · ${esc(x.action)}</span>`:''}<p>${esc(x.summary||x.text||x.note||x.skinStatus||'')}</p>${x.reflection||x.plan?`<p class="tiny">Refleksi / tindak lanjut: ${esc(x.reflection||x.plan)}</p>`:''}${x.wound?`<p>${esc(x.wound)}</p>`:''}${x.reviews?.map(r=>`<div class="banner"><strong>Review pembimbing · ${esc(r.status)}</strong><br>${esc(r.comment)}${r.score!==undefined?`<br>Skor formatif: ${r.score}/4 · ${esc(r.outcome)}`:''}</div>`).join('')||''}${!review&&['Draf','Perlu revisi'].includes(x.status)&&key==='logs'?`<button class="btn light" data-edit="${x.id}">Buka dan revisi</button>`:''}${!review&&x.status==='Perlu revisi'&&['reflections','attendance'].includes(key)?`<form class="resubmitForm" data-key="${key}" data-id="${x.id}"><label>Koreksi / tindak lanjut<textarea name="correction" required maxlength="3000"></textarea></label><button class="btn light">Ajukan kembali</button></form>`:''}${review&&teacher()&&x.status==='Diajukan'?reviewForm(key,x):''}</article>`).join('')}
function reviewForm(key,x){return `<form class="reviewForm" data-key="${key}" data-id="${x.id}"><label>Umpan balik pembimbing<textarea name="comment" required maxlength="3000" placeholder="Kekuatan, bukti observasi, dan langkah perbaikan."></textarea></label>${key==='logs'?`<label>Skor performa formatif (bukan nilai akhir RPS)<select name="score"><option value="0">0 — Tidak ada bukti</option><option value="1">1 — Belum kompeten</option><option value="2">2 — Berkembang</option><option value="3">3 — Baik</option><option value="4">4 — Sangat baik</option></select></label><label>Hasil penilaian<select name="outcome"><option>Perlu perbaikan</option><option>Kompeten dalam supervisi</option><option>Tidak dapat dinilai</option></select></label>`:''}<div class="actions"><button name="decision" value="Perlu revisi" class="btn light">Minta revisi</button><button name="decision" value="Terverifikasi" class="btn">Verifikasi</button></div></form>`}
function drawSkills(){let q=$('#skillSearch').value.toLowerCase();$('#skillList').innerHTML=DATA.competencies.filter(c=>(c.name+' '+c.group+' '+c.id).toLowerCase().includes(q)).map(c=>`<button type="button" class="row ${selected===c.id?'selected':''}" data-skill="${c.id}"><small>${c.id} · ${esc(c.group)}</small>${esc(c.name)}</button>`).join('')||'<p>Tidak ada target yang cocok.</p>';$('#chosenSkill').textContent=DATA.competencies.find(c=>c.id===selected)?.name||'Kompetensi dari catatan sebelumnya';$('#skillList').querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{selected=b.dataset.skill;drawSkills()})}
function drawDx(){let q=$('#dxSearch').value.toLowerCase(),ger=$('#dxFilter').value==='gerontik';let list=DATA.catalog.diagnoses.filter(c=>(c.kode+' '+c.nama).toLowerCase().includes(q)&&(!ger||/jatuh|kulit|tekan|nutrisi|tidur|nyeri|mobilitas|memori|konfusi|perawatan diri|kesepian|isolasi sosial|eliminasi|inkontinensia|konstipasi|menelan/.test(c.nama.toLowerCase())));$('#dxCount').textContent=list.length+' diagnosis ditemukan';$('#dxList').innerHTML=list.map(c=>`<button class="row ${dx===c.kode?'selected':''}" data-dx="${c.kode}"><small>${c.kode} · ${esc(c.subkategori)}</small>${esc(c.nama)}</button>`).join('')||'<p>Tidak ada diagnosis yang cocok.</p>';let c=DATA.catalog.diagnoses.find(c=>c.kode===dx);$('#dxDetail').innerHTML=`<span class="eyebrow">${c.kode} · ${esc(c.jenis)}</span><h2>${esc(c.nama)}</h2><p class="tiny">Sumber sekunder · belum disahkan terhadap edisi resmi prodi</p><h3>Luaran yang tercantum pada sumber</h3>${pairs(c.slki)}<h3>Intervensi yang tercantum pada sumber</h3>${pairs(c.siki)}<div class="banner">Pasangan dengan tanda konflik belum boleh dipakai sebagai acuan kode final. Ketiadaan tanda konflik tidak berarti sudah tervalidasi resmi.</div><a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener noreferrer">Telaah halaman sumber ↗</a>`;$('#dxList').querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>{dx=b.dataset.dx;drawDx()})}
function pairs(a){return a.map(p=>`<div class="record"><strong>${esc(p.kode)} · ${esc(p.nama)}</strong>${p.conflictReason?`<p class="tiny"><span class="tag amber">Perlu verifikasi kode</span><br>${esc(p.conflictReason)}</p>`:''}</div>`).join('')||'<p>Belum tersedia pada snapshot sumber.</p>'}
function drawSop(){let q=$('#sopSearch').value.toLowerCase(),all=$('#sopFilter').value==='all';let list=DATA.sops.filter(s=>(all||s.priority)&&s.nama.toLowerCase().includes(q));$('#sopList').innerHTML=list.map(s=>`<article class="card"><span class="tag ${s.priority?'':'gray'}">${s.priority?'Prioritas lansia / dewasa':'Katalog sumber'}</span><h3>${esc(s.nama)}</h3><p>Pelajari sumber lengkap dan diskusikan kesesuaiannya dengan pembimbing.</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Baca di perawat.org ↗</a></article>`).join('')||'<p>Tidak ada SOP yang cocok.</p>'}
function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 if(page==='sop'){$('#sopSearch').oninput=drawSop;$('#sopFilter').onchange=drawSop;drawSop()}
 if(page==='catalog'){$('#dxSearch').oninput=drawDx;$('#dxFilter').onchange=drawDx;drawDx()}
 document.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{let f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.video;f.title='Video pembelajaran Amzal Mortin Andas';f.allow='encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';b.replaceWith(f)});
 if(page==='logbook'){drawSkills();$('#skillSearch').oninput=drawSkills;$('#logForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),intent=e.submitter?.value||'draft';if(v.date>today())return toast('Tanggal kegiatan tidak boleh di masa depan.');if(v.context==='Praktik klinik'&&v.action==='Melakukan simulasi')return toast('Sesuaikan konteks menjadi Simulasi untuk kegiatan simulasi.');if(v.context==='Simulasi'&&v.action==='Melakukan dengan supervisi')return toast('Pilih Melakukan simulasi untuk konteks simulasi.');let old=db.logs.find(x=>x.id===editing);if(old&&!['Draf','Perlu revisi'].includes(old.status))return toast('Catatan ini sedang dinilai atau sudah terverifikasi.');let x={...(old||{}),...v,id:old?.id||uid(),skill:selected,status:intent==='submit'?'Diajukan':'Draf',updated:new Date().toISOString()};if(old){x.history=[...(old.history||[]),{...old,history:undefined}];db.logs[db.logs.indexOf(old)]=x}else db.logs.push(x);save();editing=null;render();toast('Catatan tersimpan di perangkat; tunggu konfirmasi server.');};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{let x=db.logs.find(x=>x.id===b.dataset.edit);editing=x.id;selected=x.skill;drawSkills();for(let [k,v]of Object.entries(x)){let el=$('#logForm').elements.namedItem(k);if(el)el.value=v}$('#logForm').scrollIntoView({behavior:'smooth'});toast('Revisi dibuka; simpan atau ajukan kembali.');})}
 if(page==='reflection')$('#reflectionForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(db.reflections.some(x=>x.week===v.week))return toast('Minggu ini sudah memiliki refleksi. Gunakan tindak lanjut bila diminta revisi.');db.reflections.push({...v,id:uid(),status:'Diajukan',date:today()});save();render();toast('Refleksi disimpan; tunggu konfirmasi server.');};
 if(page==='attendance')$('#attendanceForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),d=new Date(v.date+'T12:00:00');if(v.date>today())return toast('Tanggal tidak boleh di masa depan.');if([0,6].includes(d.getDay()))return toast('Bawaan periode hanya Senin–Jumat. Hari pengganti memerlukan pengaturan koordinator.');if(db.attendance.some(x=>x.date===v.date&&x.shift===v.shift))return toast('Tanggal dan shift ini sudah dilaporkan.');if(v.presence==='Hadir'&&(!v.start||!v.end||v.end<=v.start))return toast('Isi jam masuk dan keluar yang berurutan.');if(v.presence!=='Hadir'&&!v.note.trim())return toast('Isi alasan izin atau sakit.');db.attendance.push({...v,id:uid(),status:'Diajukan',late:v.date<today(),created:new Date().toISOString()});save();render();toast('Kehadiran disimpan; tunggu konfirmasi server.');};

        function formatInstrumentDisplayScore(def, total) {
            return def.displayScoreFn ? def.displayScoreFn(total) : String(Number.isInteger(total) ? total : Number(total.toFixed(2)));
        }


        function getAnswerForReport(minggu, key, item) {
            const raw = State.instrumenRaw?.[minggu]?.[key]?.[item.id];
            if (item.type === 'number') {
                const value = State.instrumen?.[minggu]?.[key]?.[item.id];
                if (value === undefined) return null;
                return { text: raw?.text || `${value} ${item.unit || ''}`.trim(), value };
            }
            if (raw && Number.isInteger(raw.optionIndex) && item.opt?.[raw.optionIndex]) {
                return { text: raw.text || item.opt[raw.optionIndex].t, value: raw.rawValue ?? raw.value, scoreValue: raw.scoreValue ?? State.instrumen?.[minggu]?.[key]?.[item.id] };
            }
            const value = State.instrumen?.[minggu]?.[key]?.[item.id];
            if (value === undefined) return null;
            const matches = (item.opt || []).filter(o => o.v === value);
            if (matches.length === 1) return { text: matches[0].t, value };
            return { text: `Skor ${value} (teks jawaban asli tidak tersimpan pada data versi lama)`, value };
        }

        function instrumentReportHtml(minggu, key) {
            const def = INSTRUMEN[key];
            if (!def || !def.items.length) return '';
            const data = State.instrumen?.[minggu]?.[key] || {};
            let total = 0, answered = 0;
            const rows = def.items.map((it, idx) => {
                const ans = getAnswerForReport(minggu, key, it);
                if (data[it.id] !== undefined) { total += Number(data[it.id]) || 0; answered++; }
                return `<tr><td style="width:7%;text-align:center;">${idx+1}</td><td style="width:48%;">${esc(it.q)}</td><td style="width:33%;">${ans ? esc(ans.text) : '-'}</td><td style="width:12%;text-align:center;">${ans ? esc(ans.scoreValue ?? ans.value) : '-'}</td></tr>`;
            }).join('');
            if (answered === 0) return '';
            let status = `${formatInstrumentDisplayScore(def,total)} — Belum lengkap (${answered}/${def.items.length})`;
            if (answered === def.items.length) status = `${formatInstrumentDisplayScore(def,total)} — ${def.interp(total).t}`;
            const detail = answered === def.items.length && def.detailFn ? `<div class="report-note">${esc(def.detailFn(data))}</div>` : '';
            return `<h3>${esc(def.title)}</h3>${def.sourceNote ? `<div class="report-note">${esc(def.sourceNote)}</div>` : ''}<table class="report-table"><thead><tr><th>No</th><th>Pertanyaan</th><th>Jawaban</th><th>Skor</th></tr></thead><tbody>${rows}</tbody></table><div class="report-score">Skor/Interpretasi: ${esc(status)}</div>${detail}`;
        }

        function renderFullPrintReport() {
            const container = document.getElementById('printReport');
            const now = new Date();
            const printedAt = now.toLocaleString('id-ID', { dateStyle:'long', timeStyle:'short' });
            let html = `<h1 class="report-title">ASUHAN KEPERAWATAN GERONTIK</h1>`;
            html += `<p class="report-subtitle">Laporan lengkap pengkajian, instrumen lansia, dan asuhan keperawatan</p>`;
            html += `<table class="report-meta"><tr><td><strong>Nama Mahasiswa</strong><br>${esc(State.mahasiswa.nama || '-')}</td><td><strong>NIM</strong><br>${esc(State.mahasiswa.nim || '-')}</td><td><strong>Status</strong><br>${esc(State.mahasiswa.status || '-')}</td></tr><tr><td colspan="3"><strong>Waktu cetak</strong>: ${esc(printedAt)}</td></tr></table>`;

            for (let m = 1; m <= 2; m++) {
                const d = State.demografi[m] || {};
                const a = State.asuhan[m] || {};
                html += `<section class="report-section report-week"><h2>MINGGU KE-${m}</h2>`;

                html += `<h3>A. Pengkajian Demografi Lansia</h3>`;
                html += `<table class="report-meta"><tr><td><strong>Nama Lansia</strong><br>${esc(d.namaLansia || '-')}</td><td><strong>Usia</strong><br>${esc(d.usia || '-')}</td><td><strong>Jenis Kelamin</strong><br>${esc(d.jenisKelamin || '-')}</td></tr>`;
                html += `<tr><td><strong>Status Perkawinan</strong><br>${esc(d.statusKawin || '-')}</td><td><strong>Pendidikan</strong><br>${esc(d.pendidikan || '-')}</td><td><strong>Pekerjaan Terakhir</strong><br>${esc(d.pekerjaan || '-')}</td></tr>`;
                html += `<tr><td><strong>Lama Tinggal</strong><br>${esc(d.lamaTinggal || '-')}</td><td colspan="2"><strong>Tempat Tinggal Saat Ini</strong><br>${esc(d.tempatTinggal || '-')}</td></tr></table>`;
                html += `<div class="report-box"><strong>Riwayat Penyakit</strong>\n${esc(d.riwayatPenyakit || '-')}</div>`;
                html += `<div class="report-box"><strong>Obat-obatan</strong>\n${esc(d.obatObatan || '-')}</div>`;

                html += `<h3>B. Instrumen Pengkajian Lansia</h3>`;
                const instrumentBlocks = Object.keys(INSTRUMEN).map(key => instrumentReportHtml(m, key)).filter(Boolean);
                html += instrumentBlocks.length ? instrumentBlocks.join('') : `<div class="report-box">Belum ada instrumen yang diisi pada minggu ini.</div>`;

                html += `<h3>C. Asuhan Keperawatan Gerontik</h3>`;
                html += `<div class="report-box"><strong>1. Pemeriksaan Fisik (Head to Toe)</strong>\n${esc(a.fisik || '-')}</div>`;

                html += `<strong>2. Analisa Data</strong>`;

function instScore(key,week=clinicalWeek){let d=INSTRUMEN[key],a=State.instrumen[week]?.[key]||{},n=d.items.filter(i=>a[i.id]!==undefined&&a[i.id]!=='').length,total=d.items.reduce((s,i)=>s+(Number(a[i.id])||0),0);return {n,total,count:d.items.length,shown:formatInstrumentDisplayScore(d,total),interpretation:n===d.items.length?d.interp(total).t:n?'Belum lengkap — interpretasi belum ditampilkan':'Belum diisi',detail:n===d.items.length&&d.detailFn?d.detailFn(a):''}}

ong><p>${score.n}/${score.count} butir · ${esc(score.interpretation)}</p>${score.detail?`<p>${esc(score.detail)}</p>`:''}</div><div class="actions"><button class="btn" data-save-clinical>Simpan instrumen</button><button class="btn light" data-go="assessment">Lanjut head-to-toe →</button></div><p class="tiny">Mempertahankan instrumen aplikasi tidak merupakan validasi ulang klinis. Hasil skrining ditelaah pembimbing bersama temuan pengkajian.</p></section></div>`};
function updateScorePanel(){let s=instScore(clinicalInstrument);$('#clinicalScore').innerHTML=`<strong>${s.n?esc(s.shown):'—'}</strong><p>${s.n}/${s.count} butir · ${esc(s.interpretation)}</p>${s.detail?`<p>${esc(s.detail)}</p>`:''}`;const b=document.querySelector(`[data-instrument="${clinicalInstrument}"] small`);if(b)b.textContent=s.n+'/'+s.count}

const REPORT_LABEL={date:'Tanggal',shift:'Shift',room:'Wisma',context:'Konteks',action:'Peran mahasiswa',supervisor:'Pembimbing',summary:'Tindakan dan hasil',reflection:'Refleksi dan rencana perbaikan',status:'Status pengajuan',week:'Minggu',text:'Isi refleksi',plan:'Tindak lanjut',start:'Jam masuk',end:'Jam keluar',presence:'Kehadiran',note:'Catatan',late:'Dilaporkan setelah tanggal kegiatan',created:'Waktu pencatatan',updated:'Pembaruan',outcome:'Hasil penilaian',score:'Skor demo',comment:'Umpan balik',at:'Waktu review',caseCode:'Kode kasus',skinStatus:'Kondisi kulit',wound:'Temuan luka'};
function objectReport(v,key){let result='';for(let[k,x]of Object.entries(v)){if(['id','history'].includes(k)||x===undefined||x===null||x==='')continue;if(k==='skill'){result+=`<div class="report-box"><strong>Kompetensi</strong>\n${esc(x)} ${esc(DATA.competencies.find(c=>c.id===x)?.name||'')}</div>`;continue}if(Array.isArray(x)){result+=`<h3>${k==='reviews'?'Riwayat review':k==='corrections'?'Koreksi mahasiswa':esc(k)}</h3>`+x.map(y=>objectReport(y,key)).join('');continue}if(typeof x==='object'){result+=objectReport(x,key);continue}result+=`<div class="report-box"><strong>${esc(REPORT_LABEL[k]||k)}</strong>\n${esc(typeof x==='boolean'?(x?'Ya':'Tidak'):x)}</div>`}if(v.history?.length)result+=`<h3>Versi catatan sebelumnya (${v.history.length})</h3>`+v.history.map(h=>objectReport({...h,history:undefined},key)).join('');return result}
views.report=()=>{let html=fullReportHTML();return pageTitle('Laporan utuh dari seluruh isian','Laporan lengkap & PDF.','Laporan memuat kedua minggu, seluruh jawaban instrumen yang diisi, head-to-toe, analisa data, rencana dan evaluasi, serta portofolio pembelajaran.')+`<div class="card"><div class="actions"><button class="btn" id="makeClinicalPdf">Buat / perbarui PDF lengkap</button><button class="btn light" id="downloadClinicalPdf" disabled>Unduh PDF</button><button class="btn light" id="browserPrintAll">Cetak melalui browser</button></div><p id="pdfState" class="report-caption" role="status">PDF dibangun dari isian terbaru. Margin A4 15 mm, teks panjang mengalir dan tabel memiliki kepala berulang.</p><iframe id="clinicalPdfFrame" class="report-frame" title="Pratinjau PDF lengkap" hidden></iframe></div><details class="card section"><summary>Lihat seluruh isi laporan sebelum membuat PDF</summary><div class="section">${html}</div></details>`};
async function makeClinicalPdf(){let b=$('#makeClinicalPdf');if(b)b.disabled=true;let status=$('#pdfState');if(status)status.textContent='Sedang membuat PDF lengkap…';try{if(!window.pdfMake?.vfs)throw new Error('Komponen PDF belum siap. Muat ulang preview dan coba kembali.');fullReportHTML();let def=geroPdfDefinition($('#printReport'),{name:State.mahasiswa.nama,isFinal:false});def.info.title='Askep Gerontik Digital - Pengkajian dan Portofolio Lengkap';let blob=await new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(Error('Pembuatan PDF melewati batas waktu.')),60000);try{pdfMake.createPdf(def).getBlob(b=>{clearTimeout(timer);resolve(b)})}catch(e){clearTimeout(timer);reject(e)}});if(pdfBlobUrl)URL.revokeObjectURL(pdfBlobUrl);pdfBlobUrl=URL.createObjectURL(blob);let f=$('#clinicalPdfFrame');if(f){f.src=pdfBlobUrl;f.hidden=false;$('#downloadClinicalPdf').disabled=false;$('#downloadClinicalPdf').onclick=()=>{let a=document.createElement('a');a.href=pdfBlobUrl;a.download='Askep_Gerontik_Lengkap_'+String(State.mahasiswa.nim||'Simulasi').replace(/[^a-z0-9_-]/gi,'_')+'.pdf';a.click()};status.textContent='PDF lengkap siap · '+(blob.size/1024).toFixed(0)+' KB · draf simulasi, belum dikirim ke dosen.'}}catch(e){if(status)status.textContent=e.message;toast(e.message)}finally{if(b)b.disabled=false}}

const RUBRICS={
 DOPS:{name:'DOPS · keterampilan prosedural',items:[['Indikasi, kontraindikasi dan risiko',true],['Persiapan alat, lingkungan, lansia dan persetujuan',true],['Kebersihan tangan dan APD sesuai kebutuhan',true],['Langkah tindakan sesuai SOP dan supervisi',false],['Keselamatan, kenyamanan, privasi dan martabat',true],['Pemantauan respons, penghentian dan eskalasi',true],['Dokumentasi objektif tindakan dan hasil',false]]},
 'mini-CEX':{name:'mini-CEX / BST · pengkajian klinik',items:[['Identifikasi, persetujuan dan penjelasan',true],['Komunikasi terapeutik sesuai kebutuhan sensorik dan budaya',false],['Pengkajian terarah dan pemeriksaan',false],['Interpretasi temuan dan prioritas masalah',false],['Keselamatan, pencegahan infeksi dan privasi',true],['Intervensi sesuai kompetensi dan respons lansia',true],['Kolaborasi, komunikasi dan dokumentasi',false]]},
 EBN:{name:'Telaah EBN · journal reading (adaptasi)',items:[['Rumusan pertanyaan klinik / PICO',false],['Strategi pencarian dan pemilihan sumber',false],['Telaah kritis metode dan hasil',false],['Kesesuaian bukti untuk lansia di panti',false],['Pertimbangan keselamatan, etik dan preferensi lansia',true],['Rencana penerapan, evaluasi dan penyampaian',false]]}
};
const COMP_SCALE=['0 — Belum ada bukti','1 — Memerlukan arahan penuh','2 — Memerlukan banyak arahan','3 — Memadai dalam supervisi','4 — Konsisten dalam supervisi'];
function competencyName(x){return DATA.competencies.find(c=>c.id===x.skill)?.name||x.skillName||x.skill||'Bukti sebelumnya'}
function competencyError(v,submit){if(v.date&&(!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||Number.isNaN(Date.parse(v.date+'T12:00:00'))||v.date>today()))return 'Tanggal kegiatan harus valid dan tidak di masa depan.';if(!DATA.competencies.some(c=>c.id===v.skill)||!RUBRICS[v.method])return 'Pilih kompetensi dan metode penilaian.';if(v.context==='Praktik klinik'&&v.action==='Melakukan simulasi'||v.context==='Simulasi'&&v.action==='Melakukan dengan supervisi')return 'Sesuaikan peran mahasiswa dengan konteks praktik atau simulasi.';if(submit){for(let k of ['date','shift','room','week','supervisor','summary','evidence','reflection'])if(!String(v[k]||'').trim())return 'Lengkapi tanggal, shift, wisma, minggu, pembimbing, tindakan, bukti dan refleksi sebelum diajukan.';}return '';}
function assessmentError(x,r,decision){if(!r.examiner?.trim()||!r.comment?.trim()||!r.observed?.trim())return 'Isi nama penilai, tanggal observasi dan umpan balik.';if(r.observed<x.date||r.observed>today())return 'Tanggal observasi harus antara tanggal kegiatan dan hari ini.';if(decision==='Perlu revisi')return '';let items=RUBRICS[x.method].items;if(!Array.isArray(r.scores)||r.scores.length!==items.length||r.scores.some(s=>s===''||!(s==='NA'||Number.isInteger(+s)&&+s>=0&&+s<=4)))return 'Nilai setiap aspek; pilih N/A bila tidak relevan.';if(r.scores.includes('NA')&&!r.naReason?.trim())return 'Jelaskan alasan aspek N/A; aspek tersebut dikeluarkan dari penyebut.';let valid=r.scores.filter(s=>s!=='NA');if(!valid.length)return 'Seluruh aspek N/A tidak dapat menghasilkan nilai. Kembalikan untuk dilengkapi.';if(!['Kompeten dalam supervisi','Perlu perbaikan','Tidak dapat dinilai'].includes(r.outcome))return 'Pilih hasil penilaian.';if(r.outcome==='Kompeten dalam supervisi'){if(x.action==='Mengamati')return 'Pengamatan saja belum membuktikan kemampuan melakukan.';if(r.scores.some((s,i)=>items[i][1]&&(s==='NA'||+s<3)))return 'Aspek keselamatan wajib terobservasi dengan skor minimal 3 pada aturan formatif preview.';if(valid.some(s=>+s<3))return 'Masih ada aspek di bawah 3; pilih perlu perbaikan atau lakukan observasi ulang.';}return '';}
function competencyScore(scores){let a=scores.filter(s=>s!==''&&s!=='NA');return a.length?Math.round(a.reduce((n,s)=>n+Number(s),0)/(4*a.length)*1000)/10:null;}
function latestCompetencies(context){let map=new Map();for(let x of competencyRecords().filter(x=>x.context===context))map.set(x.skill,x);return [...map.values()];}
function passedCompetencies(context){return latestCompetencies(context).filter(x=>x.status==='Terverifikasi'&&x.reviews?.at(-1)?.outcome==='Kompeten dalam supervisi'&&x.action!=='Mengamati');}
function compSelect(name,label,values,value){return `<label>${label}<select name="${name}">${values.map(v=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;}
function competencyForm(){let x=competencyRecords().find(x=>x.id===competencyEditing&&['Draf','Perlu revisi'].includes(x.status))||{date:today(),shift:'Pagi',room:'Wisma A',week:'1',context:'Praktik klinik',action:'Melakukan dengan supervisi',method:'DOPS',skill:DATA.competencies[0].id};return `<div class="card"><div class="section-head"><h2>${x.id?'Revisi / lanjutkan draf':'Catat kompetensi praktik'}</h2><span class="tag">Mahasiswa</span></div><p>Catat tindakan yang benar-benar dilakukan, gunakan kode kasus anonim, lalu ajukan observasi kepada pembimbing.</p><form id="competencyForm" novalidate><label>Kompetensi<select name="skill">${DATA.competencies.map(c=>`<option value="${c.id}" ${c.id===x.skill?'selected':''}>${c.id} · ${esc(c.name)}</option>`).join('')}</select></label><div class="fields"><label>Tanggal kegiatan<input type="date" name="date" max="${today()}" value="${esc(x.date)}"></label>${compSelect('week','Minggu',['1','2'],x.week)}${compSelect('shift','Shift',['Pagi','Siang'],x.shift)}${compSelect('room','Wisma',['Wisma A','Wisma B','Wisma C','Wisma D'],x.room)}${compSelect('context','Konteks',['Praktik klinik','Simulasi'],x.context)}${compSelect('action','Peran mahasiswa',['Melakukan dengan supervisi','Melakukan simulasi','Mengamati'],x.action)}${compSelect('method','Metode observasi',Object.keys(RUBRICS),x.method)}<label>Nama pembimbing<input name="supervisor" maxlength="120" value="${esc(x.supervisor)}"></label></div><p class="tiny">DOPS untuk prosedur; mini-CEX/BST untuk pengkajian; EBN untuk journal reading. Penentuan akhir mengikuti pembimbing.</p><label>Kode kasus anonim (opsional)<input name="caseCode" maxlength="40" value="${esc(x.caseCode)}" placeholder="Contoh: L-01 · tanpa nama / nomor rekam medis"></label>${[['summary','Tindakan, respons lansia dan hasil'],['evidence','Bukti observasi / rujukan portofolio anonim'],['reflection','Refleksi dan rencana perbaikan']].map(([k,l])=>`<label>${l}<textarea name="${k}" maxlength="5000">${esc(x[k])}</textarea></label>`).join('')}<div class="actions"><button class="btn light" name="intent" value="draft">Simpan draf</button><button class="btn" name="intent" value="submit">Ajukan penilaian dosen →</button>${x.id?'<button type="button" class="btn light" id="cancelCompetency">Batal revisi</button>':''}</div><p id="competencyError" role="alert" class="form-error"></p></form></div>`;}
function competencyReviewForm(x){let rubric=RUBRICS[x.method];return `<form class="competencyReview" data-id="${x.id}" novalidate><h3>Observasi dosen · ${esc(rubric.name)}</h3><p class="tiny">Rubrik formatif 0–4 dari draf RPS; EBN merupakan adaptasi. N/A tidak dihitung dalam penyebut. Aspek bertanda * wajib terobservasi untuk hasil kompeten.</p><div class="fields"><label>Nama dosen / preseptor penilai<input name="examiner" maxlength="120"></label><label>Tanggal observasi<input type="date" name="observed" min="${esc(x.date)}" max="${today()}" value="${esc(x.date)}"></label></div>${rubric.items.map(([t,critical],i)=>`<label>${i+1}. ${esc(t)}${critical?' *':''}<select name="criterion${i}" data-score><option value="">Pilih hasil observasi</option>${COMP_SCALE.map((t,j)=>`<option value="${j}">${t}</option>`).join('')}<option value="NA">N/A — Tidak relevan / tidak diobservasi</option></select></label>`).join('')}<p class="score-preview" aria-live="polite">Skor belum lengkap.</p><label>Alasan aspek N/A (wajib bila dipilih)<textarea name="naReason" maxlength="1500"></textarea></label><label>Hasil penilaian<select name="outcome"><option value="">Pilih keputusan dosen</option><option>Kompeten dalam supervisi</option><option>Perlu perbaikan</option><option>Tidak dapat dinilai</option></select></label><label>Umpan balik, bukti observasi dan tindak lanjut<textarea name="comment" maxlength="5000"></textarea></label><div class="banner tiny">Aturan formatif: hasil “kompeten” memerlukan semua aspek relevan ≥3 dan seluruh aspek keselamatan terobservasi ≥3. Keputusan tetap pada dosen. Belum menjadi nilai akhir atau standar kelulusan resmi prodi.</div><div class="actions"><button class="btn light" name="decision" value="Perlu revisi">Kembalikan untuk revisi</button><button class="btn" name="decision" value="Terverifikasi">Simpan hasil penilaian</button></div><p role="alert" class="form-error"></p></form>`;}
function competencyReviewHTML(x,r){return `<div class="banner"><strong>${esc(r.outcome||r.decision)}${r.percent!==null&&r.percent!==undefined?' · '+r.percent+'/100':''}</strong><p>${esc(r.comment)}</p><span class="tiny">${esc(r.examiner)} · Observasi ${esc(r.observed)} · Dicatat ${esc(r.at)}</span><details><summary>Rincian rubrik & N/A</summary>${r.scores?.map((s,i)=>`<p>${i+1}. ${esc(RUBRICS[r.method||x.method].items[i]?.[0])}: <strong>${s===''?'Belum dinilai':esc(s)}</strong></p>`).join('')||''}${r.naReason?`<p>Alasan N/A: ${esc(r.naReason)}</p>`:''}</details></div>`;}
function competencyList(){let a=competencyRecords().filter(x=>!teacher()||x.status!=='Draf');return a.length?a.slice().reverse().map(x=>`<article class="record"><div class="section-head">${badge(x.status)}<span class="tiny">Minggu ${esc(x.week)} · ${esc(x.date)} · ${esc(x.shift)} · ${esc(x.room)}</span></div><h3>${esc(x.skill)} · ${esc(competencyName(x))}</h3><p class="tiny">${esc(x.context)} · ${esc(x.action)} · ${esc(x.method)} · Pembimbing: ${esc(x.supervisor||'Belum diisi')}</p>${x.caseCode?`<p>Kode kasus: ${esc(x.caseCode)}</p>`:''}<p>${esc(x.summary||'Draf belum lengkap.')}</p><details><summary>Bukti, refleksi & riwayat</summary><p>Bukti: ${esc(x.evidence||'Belum diisi')}</p><p>Refleksi: ${esc(x.reflection||'Belum diisi')}</p><p class="tiny">${x.history?.length||0} versi sebelumnya disimpan dan ikut dicetak pada PDF lengkap.</p></details>${(x.reviews||[]).map(r=>competencyReviewHTML(x,r)).join('')}${!teacher()&&['Draf','Perlu revisi'].includes(x.status)?`<button class="btn light" data-comp-edit="${x.id}">Buka / perbaiki catatan</button>`:''}${teacher()&&x.status==='Diajukan'?competencyReviewForm(x):''}</article>`).join(''):'<div class="blank">Belum ada form kompetensi. Mahasiswa mengajukan bukti; dosen menilai setelah observasi.</div>';}
views.competency=()=>pageTitle('Portofolio · observasi · umpan balik','Form kompetensi gerontik.','Penilaian kompetensi tindakan di panti; simulasi dan praktik klinik ditampilkan terpisah.')+`<div class="banner">${teacher()?'Mode dosen: baca bukti mahasiswa dan nilai pengajuan di bawah.':'Alur: simpan draf → ajukan → observasi dosen → hasil / revisi.'} Hasil bersifat formatif; nama penilai bukan tanda tangan elektronik.</div>${teacher()?'':competencyForm()}<div class="card section"><h2>${teacher()?'Pengajuan & hasil penilaian':'Riwayat kompetensi saya'}</h2>${competencyList()}</div>`;
function bindCompetency(){let f=$('#competencyForm');if(f)f.onsubmit=e=>{e.preventDefault();if(teacher())return;let v=Object.fromEntries(new FormData(f)),submit=e.submitter?.value==='submit',error=competencyError(v,submit),old=competencyRecords().find(x=>x.id===competencyEditing);if(old&&!['Draf','Perlu revisi'].includes(old.status))error='Catatan sedang dinilai atau sudah selesai; buat asesmen ulang baru.';if(error){$('#competencyError').textContent=error;return;}let x={...(old||{}),...v,id:old?.id||uid(),status:submit?'Diajukan':'Draf',updated:new Date().toISOString()};if(old){x.history=[...(old.history||[]),{...old,history:undefined}];db.competency[db.competency.indexOf(old)]=x;}else db.competency.push(x);if(!save())return;competencyEditing=null;render();toast(submit?'Pengajuan tersimpan di perangkat; tunggu konfirmasi server.':'Draf tersimpan di perangkat; tunggu konfirmasi server.');};$('#cancelCompetency')?.addEventListener('click',()=>{competencyEditing=null;render()});document.querySelectorAll('[data-comp-edit]').forEach(b=>b.onclick=()=>{competencyEditing=b.dataset.compEdit;render();$('#competencyForm').scrollIntoView({behavior:'smooth'})});document.querySelectorAll('.competencyReview').forEach(f=>{f.querySelectorAll('[data-score]').forEach(el=>el.onchange=()=>{let s=[...f.querySelectorAll('[data-score]')].map(e=>e.value);f.querySelector('.score-preview').textContent=s.some(x=>x==='')?'Skor belum lengkap.':competencyScore(s)===null?'Seluruh aspek N/A.':`Skor formatif: ${competencyScore(s)}/100 · ${s.filter(x=>x!=='NA').length} aspek dihitung`;});f.onsubmit=e=>{e.preventDefault();if(!teacher())return;let x=competencyRecords().find(x=>x.id===f.dataset.id);if(x?.status!=='Diajukan')return;let r=Object.fromEntries(new FormData(f)),decision=e.submitter?.value,scores=[...f.querySelectorAll('[data-score]')].map(e=>e.value);r={method:x.method,examiner:r.examiner,observed:r.observed,comment:r.comment,naReason:r.naReason,outcome:r.outcome,scores,decision,at:new Date().toISOString()};let error=assessmentError(x,r,decision);if(error){f.querySelector('.form-error').textContent=error;return;}r.percent=decision==='Terverifikasi'?competencyScore(scores):null;x.reviews=[...(x.reviews||[]),r];x.status=decision;x.updated=r.at;if(!save())return;render();toast('Penilaian sedang dikirim ke server.');};});}
function dashboardStats(){let clinical=passedCompetencies('Praktik klinik').length,simulation=passedCompetencies('Simulasi').length,all=competencyRecords(),pending=all.filter(x=>x.status==='Diajukan').length;return {clinical,simulation,pending,revision:all.filter(x=>x.status==='Perlu revisi').length,all};}

n></div></div><p>Asesmen terbaru per kompetensi, konteks klinik, hasil kompeten dalam supervisi. Katalog bukan target wajib atau nilai akhir.</p></div><div class="card"><div class="section-head"><h2>${teacher()?'Antrean penilaian':'Dokumen & umpan balik'}</h2><span class="tag">Langsung dari isian</span></div><div class="queue-chart">${queues.map(([p,t,n])=>`<button class="queue-row" data-go="${p}"><span>${t}</span><span class="queue-track"><i style="width:${n?Math.max(6,n/Math.max(1,...queues.map(x=>x[2]))*100):0}%"></i></span><strong>${n}</strong></button>`).join('')}</div><p class="tiny">Angka menunjukkan pengajuan berstatus Diajukan. Buka menu untuk melihat bukti dan riwayat revisi.</p><button class="btn" data-go="competency">${teacher()?'Buka penilaian kompetensi':'Isi form kompetensi'} →</button></div></div><div class="grid section">${[1,2].map(w=>{let complete=Object.keys(INSTRUMEN).filter(k=>assessmentV5(k,w).complete).length,started=MODULES.filter(m=>moduleCountForWeek(m,w)).length;return `<div class="card"><span class="eyebrow">Minggu ${w}</span><h3>${complete}/17 instrumen lengkap</h3><div class="meter"><i style="width:${complete/17*100}%"></i></div><p>${started}/14 modul pengkajian mulai diisi. Instrumen dipilih sesuai indikasi, kelengkapan bukan nilai kompetensi.</p><button class="btn light" data-go="interpretation">Telaah hasil instrumen</button></div>`}).join('')}<div class="card"><span class="eyebrow">Pendamping praktik</span><h3>${db.attendance.filter(x=>x.status==='Terverifikasi'&&x.presence==='Hadir').length} shift hadir terverifikasi</h3><p>${new Set(db.logs.filter(x=>x.status==='Terverifikasi'&&x.context==='Praktik klinik').map(x=>x.date)).size}/10 hari logbook klinik · ${db.reflections.filter(x=>x.status==='Terverifikasi').length}/2 refleksi.</p><button class="btn light" data-go="report">Laporan lengkap & PDF</button></div></div>`;};
